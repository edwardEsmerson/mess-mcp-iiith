name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. Runs on main
# are never cancelled, so every commit on main gets a full result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # engines is >=22.13 (node:sqlite); test the oldest and newest lines we support.
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Builds first, then runs the end-to-end suite against a mock portal.
      # Two optional cases fetch real client metadata documents from the
      # internet and skip themselves when offline.
      - run: npm test
